<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="lista">
    </ul>
    <script>
        const datosArr = document.getElementById('lista')
        fetch('https://jsonplaceholder.typicode.com/posts')
        .then(res =>{
            return res.json()
        })
        .then(datos =>{
            for(i=0; i< 5; i++){
                const li = document.createElement('li');
                li.textContent = datos[i].title;
                lista.appendChild(li)
            }
        })
        .catch(error =>{
            console.log(error)
        })
    </script>
</body>
</html>
