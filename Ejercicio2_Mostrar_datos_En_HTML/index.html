<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="user">
        
    </div>
    <script>
        const contenedor = document.getElementById('user')
        fetch('https://jsonplaceholder.typicode.com/users/1')
        .then(respons =>{
            return respons.json()
        })
        .then(data =>{
            contenedor.innerHTML = `<p>Nombee: ${data.name} <br> email: ${data.email}</p>`;
        })
        .catch(error =>{
            console.log(error);
        })
    </script>
    
</body>
</html>
